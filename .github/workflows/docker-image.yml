name: Publish PHP images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, .dockerignore, .github/workflows/docker-image.yml]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: PHP_VERSION=${{ matrix.php }}
          tags: ghcr.io/looting2/pelican-nginx-egg:${{ matrix.php }}-latest
          push: true
